<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f3ee" />
  <meta name="description" content="MoodAlbum — a year of photos, organized by month, styled like an editorial lookbook." />
  <title>MoodAlbum — a year in photos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Serif+Display:ital@0;1&family=Italiana&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Libre+Caslon+Display&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;700&family=Manrope:wght@300;400;500;700&family=Work+Sans:wght@300;400;500;700&family=Archivo:wght@300;400;500;700&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&display=swap"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============================================================ -->
  <!--  INTRO / UPLOAD VIEW                                          -->
  <!-- ============================================================ -->
  <main id="intro" class="intro" aria-label="Build your album">
    <header class="intro__head">
      <span class="head__logo" aria-hidden="true"></span>
      <span class="head__line">MoodAlbum<span>a year in photos.</span></span>
    </header>

    <div id="monthList" class="collage" role="list" aria-label="Twelve months">
      <!-- 12 collage pieces are injected by JS as direct children -->
    </div>

    <div class="intro__bar" aria-hidden="false">
      <span id="counter" class="intro__counter">
        <span id="counterPhotos">0</span> photos &middot;
        <span id="counterMonths">0</span>/12 months
      </span>
      <button id="composeBtn" class="compose-btn" type="button" disabled>
        Compose
        <span class="btn__arrow" aria-hidden="true">&rarr;</span>
      </button>
    </div>

    <!-- Hidden global file input — kept so existing handlers still bind cleanly -->
    <input type="file" id="globalInput" accept="image/*" multiple hidden />
    <div id="globalDrop" hidden></div>
  </main>

  <!-- ============================================================ -->
  <!--  ALBUM VIEW (scrapbook moodboard calendars)                   -->
  <!-- ============================================================ -->
  <main id="album" class="album" hidden aria-label="Your moodboards">
    <nav class="album__nav" aria-label="Album navigation">
      <button id="backBtn" class="album__back" type="button">&larr; Edit</button>
      <p class="album__brand">MoodAlbum</p>
      <span class="album__year" id="albumYear" aria-hidden="true"></span>
    </nav>

    <div id="boards" class="boards">
      <!-- one .board per non-empty month, injected by JS -->
    </div>
  </main>

  <!-- Hidden working canvas for color analysis -->
  <canvas id="workCanvas" width="80" height="80" hidden></canvas>

  <!-- html2canvas: client-side rasterizer used only for the "Save PNG" button -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>

  <script src="app.js" defer></script>
</body>
</html>
