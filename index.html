<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Monthly Moodboard — a year of photos in twelve months, arranged as scrapbook calendars." />
  <title>Monthly Moodboard — a year in photos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&family=Italianno&display=swap"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============================================================
       Step 1 — BENTO LANDING
       ============================================================ -->
  <main id="intro" class="view view--intro" aria-label="Choose a month">
    <div id="monthList" class="bento" role="list">
      <!-- text cell + 12 month cards injected by JS -->
    </div>
    <div class="intro__bar">
      <span id="counter" class="intro__counter">
        <span id="counterPhotos">0</span> photos &middot;
        <span id="counterMonths">0</span>/12 months
      </span>
      <button id="composeBtn" class="compose-btn" type="button" disabled>
        Compose
        <span class="btn__arrow" aria-hidden="true">&rarr;</span>
      </button>
    </div>

    <!-- Hidden global file input kept for parity with existing handlers -->
    <input type="file" id="globalInput" accept="image/*" multiple hidden />
    <div id="globalDrop" hidden></div>
  </main>

  <!-- ============================================================
       Step 2 — MONTH DETAIL
       ============================================================ -->
  <main id="detail" class="view view--detail" hidden aria-label="Month detail">
    <header class="detail__head">
      <button id="detailBack" class="iconbtn" type="button" aria-label="Back to months">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M14 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="detail__titlewrap">
        <p class="detail__eyebrow"><span id="detailIndex">01</span> &middot; <span id="detailYearLabel">2026</span></p>
        <h2 class="detail__title" id="detailTitle">January</h2>
      </div>
      <span class="detail__count" id="detailCount">0 photos</span>
    </header>

    <section class="carousel" aria-label="Photos">
      <div class="carousel__track" id="detailTrack">
        <!-- photo cards + add-card injected by JS -->
      </div>
      <div class="carousel__dots" id="detailDots" aria-hidden="true"></div>
    </section>

    <footer class="detail__foot">
      <p class="detail__hint">Assign a day to each photo to place it on the calendar.</p>
      <button id="continueBtn" class="primary-btn" type="button">
        Continue to calendar
        <span class="btn__arrow" aria-hidden="true">&rarr;</span>
      </button>
    </footer>

    <input type="file" id="detailUpload" accept="image/*" multiple hidden />
  </main>

  <!-- ============================================================
       Step 3 — CALENDAR (continuous horizontal pager, one per month)
       ============================================================ -->
  <main id="album" class="view view--album" hidden aria-label="Monthly calendar">
    <header class="album__head">
      <button id="albumBack" class="iconbtn" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M14 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="album__titlewrap">
        <p class="album__eyebrow" id="albumYear">2026</p>
        <h2 class="album__title" id="albumMonth">January</h2>
      </div>
      <button id="albumExport" class="iconbtn iconbtn--label" type="button" aria-label="Save board as PNG">
        Save PNG
      </button>
    </header>

    <div id="pager" class="pager" role="region" aria-label="Months">
      <!-- one .cal-page per month, injected by JS -->
    </div>

    <footer class="album__foot">
      <button id="prevMonth" class="iconbtn" type="button" aria-label="Previous month">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M14 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span id="pagerLabel" class="album__pagerlabel">01 / 12</span>
      <button id="nextMonth" class="iconbtn" type="button" aria-label="Next month">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M10 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </footer>
  </main>

  <!-- Hidden working canvas for the existing color analysis -->
  <canvas id="workCanvas" width="80" height="80" hidden></canvas>

  <!-- html2canvas: client-side rasterizer for "Save PNG" -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>

  <script src="app.js" defer></script>
</body>
</html>
